name: Build Self-Contained Executables

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
  release:
    types: [ published ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
        python-version: ['3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
        shell: bash

      # Optional: install system packages on Linux if your app has native deps
      - name: Install Linux system dependencies (if needed)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
        # Add more packages here as required (e.g. libgtk-3-dev for GUI apps)

      - name: Build executable with PyInstaller
        run: |
          # --onefile creates a single self-contained executable
          # --windowed suppresses the console window (Windows)
          # --clean removes temporary files
          #
          # Icon: if icon.png exists, use it.
          # On Windows, PyInstaller (with Pillow) converts PNG → ICO automatically.
          # On Linux the --icon flag has little effect on the binary itself
          # (Linux executables don't embed icons the way Windows EXEs do).
          # For the window/taskbar icon on Linux you still need to set it in your app code.
          ICON_ARGS=""
          ADD_DATA_ARGS=""
          if [ -f icon.png ]; then
            ICON_ARGS="--icon=icon.png"
            # Bundle icon.png so the running app can load it as the window icon
            if [ "$RUNNER_OS" = "Windows" ]; then
              ADD_DATA_ARGS="--add-data=icon.png;."
            else
              ADD_DATA_ARGS="--add-data=icon.png:."
            fi
          fi
          pyinstaller --onefile --windowed --clean --name IP-Golem $ICON_ARGS $ADD_DATA_ARGS IP-Golem.py
        shell: bash

      - name: List build output
        run: ls -lah dist/
        shell: bash

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: IP-Golem-${{ runner.os }}
          path: |
            dist/IP-Golem
            dist/IP-Golem.exe
          retention-days: 14
          if-no-files-found: error

  release:
    name: Upload to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Only run when a release is published (or manually triggered on a tag)
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List downloaded files
        run: ls -lah dist/

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/IP-Golem
            dist/IP-Golem.exe
          # If triggered by workflow_dispatch on a tag, use that tag
          # (when triggered by a release event it uses the release automatically)
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
